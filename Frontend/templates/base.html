<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LocalBiz Connect{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='servicestyles.css') }}">

    {% block extra_css %}{% endblock %}
</head>
<body>

<header class="Topbar">
    <div class="logo">LocalBiz Connect</div>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('services') }}">Services</a>
        <a href="{{ url_for('contact') }}">Contact</a>
        <a href="{{ url_for('student_profile') }}">Student Profile</a>
        <a href="{{ url_for('admin') }}">Admin</a>
    </nav>
</header>

<main class="main-content">
    {% block content %}{% endblock %}
</main>

<footer>
    <p>
        {% block footer %}
        LocalBiz Connect - Flask + SQLite Version
        {% endblock %}
    </p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
